name: CI-CD
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
      ECR_REPO_API: upwork-py-api
      ECR_REPO_WORKER: upwork-py-worker
      ECR_REPO_WEB: upwork-web
    steps:
      - uses: actions/checkout@v4
      - name: Build API image (Python)
        run: docker build -f python/api/Dockerfile -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_API }}:latest .
      - name: Build Worker image (Python)
        run: docker build -f python/worker/Dockerfile -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_WORKER }}:latest .
      - name: Build Web image (Next.js)
        run: docker build -f apps/web/Dockerfile -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_WEB }}:latest .
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          region: ${{ env.AWS_REGION }}
      - name: Push images
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_API }}:latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_WORKER }}:latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_WEB }}:latest

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start API with docker-compose
        run: |
          docker compose up -d db redis py-api
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/me || true)
            if [ "$code" = "401" ]; then echo OK && break; fi
            sleep 2
          done
      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs py-api || true
          docker compose logs db || true
      - name: Shutdown
        if: always()
        run: docker compose down -v

